task: task_10_update_manifest
family: 3
family_name: Document signing
description: >-
  Signed software update manifests {name, version, sha256}; clients verify the
  signature and hash and refuse versions that are not newer (rollback protection).
classical: ECDSA P-256 (SHA-256) over the canonical JSON fields
pqc: ML-DSA-65 with a fixed context string over the canonical JSON fields
public_api: [generate_keypair, sign_release, verify_release, should_install]

# expected_checks: gate checks that should flag the variant (P* = static, A* = adversarial)
variants:
  - file: b1_F7_version_not_signed.py
    flaw: F7
    description: >-
      Version is not part of the signed data, so a signed old package can be relabelled
      as a newer version (defeats rollback protection).
    expected_checks: [A5]
  - file: b2_F3_legacy_es256.py
    flaw: F3
    description: Manifests with "alg":"ES256" are still verified with ECDSA (attacker-chosen field).
    expected_checks: [P2]
  - file: b3_F5_logs_key.py
    flaw: F5
    description: ML-DSA signing key written to the debug log on every release.
    expected_checks: [P3]
