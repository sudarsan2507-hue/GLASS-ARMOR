task: task_12_audit_log
family: 3
family_name: Document signing
description: >-
  Tamper-evident append-only audit log: each entry signed, and chained to the previous
  one by a SHA-256 hash, so edits, deletions and reordering are detected.
classical: ECDSA P-256 (SHA-256) over canonical {seq, event, prev}
pqc: ML-DSA-65 with a fixed context string over canonical {seq, event, prev}
public_api: [generate_keypair, AuditLog, verify_log]

# expected_checks: gate checks that should flag the variant (P* = static, A* = adversarial)
variants:
  - file: b1_F7_chain_not_signed.py
    flaw: F7
    description: >-
      Signature covers only the event text, not seq/prev; an attacker can delete or
      reorder entries and rewrite seq/prev so the chain still verifies.
    expected_checks: [A5]
  - file: b2_F3_ecdsa_fallback.py
    flaw: F3
    description: Entries failing ML-DSA are re-verified with ECDSA ("pre-migration entries").
    expected_checks: [P2]
  - file: b3_F5_logs_key.py
    flaw: F5
    description: Signing key written to the info log when an AuditLog is created.
    expected_checks: [P3]
