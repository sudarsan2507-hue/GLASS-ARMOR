task: task_03_document_signing
family: 3
family_name: Document signing
description: >-
  Signs documents and files with a purpose label (contract, invoice, ...) bound into
  the signature. Detached .sig files for files on disk.
classical: RSA-PSS-3072 (SHA-256) over "docsign v1|<purpose>|<document>"
pqc: ML-DSA-65 with the purpose in the context string
public_api: [generate_keypair, sign_document, verify_document, sign_file, verify_file]

# expected_checks: gate checks that should flag the variant (P* = static, A* = adversarial)
variants:
  - file: b1_F7_context_ignored.py
    flaw: F7
    description: >-
      Purpose/context dropped (plain sign/verify), so a "general" signature also
      verifies as a "contract" signature.
    expected_checks: [A5]
  - file: b2_F7_prefix_only.py
    flaw: F7
    description: >-
      Only the first 4096 bytes of the document are signed/verified; changes after
      that are not detected.
    expected_checks: [A5]
  - file: b3_F3_rsa_verify_fallback.py
    flaw: F3
    description: When ML-DSA verification fails, legacy RSA-PSS verification is still attempted.
    expected_checks: [P2]
  - file: b4_F5_key_in_exception.py
    flaw: F5
    description: Private key hex included in the exception message if signing fails.
    expected_checks: [P3, A3]
    # Note for A3: liboqs-python 0.16 silently signs with a too-SHORT secret key (no error),
    # so the leak is only triggered with an over-long key (> 4032 bytes -> ValueError).
