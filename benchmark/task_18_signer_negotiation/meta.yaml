task: task_18_signer_negotiation
family: 5
family_name: Config-chosen algorithm
description: >-
  Signature algorithm picked at runtime from a registry, by config name or by
  negotiating with a peer's offered list; signed envelopes record the algorithm.
classical: Registry/preferences ["ecdsa-p256", "rsa-pss-2048"]
pqc: Registry/preferences ["ml-dsa-65"] only (ML-DSA-65 with context); no classical fallback
public_api: [SUPPORTED, DEFAULT_ALG, get_signer, negotiate, seal_envelope, open_envelope]

# expected_checks: gate checks that should flag the variant (P* = static, A* = adversarial)
variants:
  - file: b1_F9_ecdsa_preferred.py
    flaw: F9
    description: >-
      ECDSA kept and listed before ML-DSA in SUPPORTED, so it is the default and is
      chosen whenever a peer offers both.
    expected_checks: [P2, A2]
  - file: b2_F3_ecdsa_still_registered.py
    flaw: F3
    description: ECDSA signer still registered and reachable via get_signer("ecdsa-p256").
    expected_checks: [P2]
  - file: b3_F5_logs_key.py
    flaw: F5
    description: Every newly generated ML-DSA private key is written to the debug log.
    expected_checks: [P3]
